# electron-builder.public.yml - 公开版：不内置任何 Key，用户自行配置
# appId 必须与 main.js 里的 app.setAppUserModelId('com.fortune.ball') 保持一致
appId: com.fortune.ball
productName: fortune-ball
copyright: Copyright © 2026 CQL111
directories:
  output: out-public
files:
  - main.js
  - preload.js
  - package.json
  - src/**/*
  - data/canon/index.json
  - docs/legal/**/*
  - "!**/.env"
  - "!**/.env.*"
  - "!**/build/**"
  - "!**/build-out/**"
  - "!**/out*/**"
  - "!**/release/**"
  - "!**/scripts/**"
  - "!**/smoke-test.js"
  - "!**/product-intro.html"
  - "!**/data/canon/raw/**"
  - "!**/data/canon/catalog.json"
  - "!**/data/canon/zhouyi.json"
  - "!**/data/canon/ditiansui.json"
  - "!**/data/canon/yuanhai.json"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: src/assets/app-icon-1024.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 今日运势
  license: docs/legal/user-agreement.md
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: src/assets/app-icon-1024.png
  category: public.app-category.entertainment
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  title: 今日运势 ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
publish:
  provider: github
  owner: CQL111
  repo: desktop-icon
  releaseType: release
