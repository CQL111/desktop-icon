<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.minimax.io https://api.minimaxi.chat https://api.minimaxi.com https://api.deepseek.com;">
  <title>设置</title>
  <link rel="stylesheet" href="styles/settings.css">
</head>
<body>
  <div class="settings">
    <h1>设置</h1>

    <div id="llm-status" class="llm-status">检测中…</div>

    <section class="section">
      <h2>AI 模型</h2>
      <p class="hint">默认使用线上 DeepSeek 模型，无需配置。你也可以切换到自己本机的本地模型。</p>

      <label>
        <span>当前本地模型</span>
        <select id="local-model-select">
          <option value="">（使用线上 DeepSeek）</option>
        </select>
        <small id="local-model-hint">检测 Ollama 已安装模型…</small>
      </label>

      <div class="row">
        <button id="refresh" class="btn">刷新列表</button>
        <button id="use-online" class="btn ghost">使用线上</button>
      </div>
    </section>

    <section class="section">
      <h2>下载本地模型</h2>
      <p class="hint">输入模型名（如 <code>qwen2.5:7b</code>、<code>llama3</code>），从 Ollama 下载到本机。</p>

      <div class="row">
        <input id="pull-name" type="text" placeholder="qwen2.5:7b" autocomplete="off">
        <button id="pull" class="btn primary">下载</button>
      </div>
      <div id="pull-status" class="status"></div>
    </section>

    <section class="section">
      <h2>个人信息</h2>
      <p class="hint">用于个人测算（球上 👤 签）。生日必填，性别可选，地理位置自动按系统时区。</p>

      <label>
        <span>生日</span>
        <input id="birthday" type="date">
      </label>

      <label>
        <span>性别</span>
        <select id="gender">
          <option value="">保密</option>
          <option value="male">男</option>
          <option value="female">女</option>
        </select>
      </label>

      <label>
        <span>测算形态</span>
        <select id="profile-mode">
          <option value="comprehensive">综合命理档案</option>
          <option value="bazi">八字排盘</option>
          <option value="zodiac">星座性格</option>
        </select>
      </label>

      <div class="row">
        <button id="profile-save" class="btn primary">保存</button>
        <button id="profile-view" class="btn">查看测算</button>
      </div>
      <div id="profile-status" class="status"></div>
    </section>

    <section class="section">
      <h2>关于</h2>
      <p class="hint">桌面悬浮球 · 今日运势 · v1.0</p>
    </section>
  </div>
  <script src="js/rendererLogger.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
