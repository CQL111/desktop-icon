<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.minimax.io https://api.minimaxi.chat https://api.minimaxi.com https://api.minimaxi.com;">
  <title>设置</title>
  <link rel="stylesheet" href="styles/settings.css">
</head>
<body>
  <div class="settings">
    <h1>设置</h1>

    <section class="section">
      <h2>AI 运势解读</h2>
      <p class="hint">未配置也能正常使用内置 5 种运势；配置后可在卡片底部看到 AI 解读，或在球上右键提问。</p>

      <label>
        <span>API 地址</span>
        <input id="baseUrl" type="text" placeholder="https://api.minimaxi.com/anthropic" autocomplete="off">
        <small>Anthropic 兼容（推荐）：<code>https://api.minimaxi.com/anthropic</code><br>OpenAI 兼容：<code>https://api.minimaxi.com/v1</code></small>
      </label>

      <label>
        <span>API Token</span>
        <input id="token" type="password" placeholder="eyJhbGciOi..." autocomplete="off">
        <small>Token 仅本机加密存储，不会上传任何服务器</small>
      </label>

      <div class="row">
        <button id="save" class="btn primary">保存</button>
        <button id="test" class="btn">测试连接</button>
        <button id="clear" class="btn ghost">清除</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section class="section">
      <h2>关于</h2>
      <p class="hint">桌面悬浮球 · 今日运势 · v1.0</p>
    </section>
  </div>
  <script src="js/rendererLogger.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
