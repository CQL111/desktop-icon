# electron-builder.key.yml
# 内置 Key 的构建配置：继承主配置，并把 build/bundled-ai.json 复制到安装包的 resources/
# appId 必须与 main.js 里的 app.setAppUserModelId('com.fortune.ball') 保持一致，
# 否则 Windows 通知、任务栏归组和开机自启会指向不同的应用标识
appId: com.fortune.ball
productName: fortune-ball
directories:
  output: release
files:
  - main.js
  - preload.js
  - package.json
  - src/**/*
  - data/canon/index.json
  - "!**/.env"
  - "!**/.env.*"
  - "!**/build/**"
  - "!**/docs/**"
  - "!**/scripts/**"
  - "!**/smoke-test.js"
  - "!**/product-intro.html"
  - "!**/data/canon/raw/**"
  - "!**/data/canon/catalog.json"
  - "!**/data/canon/zhouyi.json"
  - "!**/data/canon/ditiansui.json"
  - "!**/data/canon/yuanhai.json"
  - "!**/.persona-anim.js"
  - "!**/.stick-shot.js"
win:
  target: nsis
  icon: src/assets/app-icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 今日运势
extraResources:
  - from: build/bundled-ai.json
    to: bundled-ai.json
publish:
  provider: github
  owner: CQL111
  repo: desktop-icon
  releaseType: release
